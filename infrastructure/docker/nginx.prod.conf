# NEXUS production reverse proxy.
#
#   client → [ this nginx ] → gunicorn (backend:8000) → Django → PostgreSQL
#
# TLS is expected to be terminated in front of this container (external load
# balancer / ingress). That upstream must set X-Forwarded-Proto; Django reads it
# via SECURE_PROXY_SSL_HEADER.

upstream nexus_backend {
    server backend:8000;
}

# Prefer the scheme reported by the upstream TLS terminator; fall back to the
# scheme seen by this nginx when there is no upstream proxy.
map $http_x_forwarded_proto $nexus_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Correlation ID: reuse the client's X-Request-ID if present, otherwise use the
# one nginx generates per request. Propagated upstream and echoed to the client.
map $http_x_request_id $nexus_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format nexus_json escape=json
    '{"timestamp":"$time_iso8601","level":"INFO","logger":"nginx.access",'
    '"request_id":"$nexus_request_id","method":"$request_method",'
    '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"referer":"$http_referer","user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name _;

    access_log /dev/stdout nexus_json;

    # Uploaded/served payload ceiling.
    client_max_body_size 10m;

    # Don't leak the nginx version.
    server_tokens off;

    # --- Django-owned paths → Gunicorn -------------------------------------
    # /static/ is served by WhiteNoise from within Gunicorn (no shared volume).
    # The correlation ID goes upstream; Django echoes it back on the response.
    location ~ ^/(api|admin|static|health)/ {
        proxy_pass http://nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nexus_forwarded_proto;
        proxy_set_header X-Request-ID      $nexus_request_id;
        proxy_redirect off;
    }

    # --- React SPA --------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA client-side routing: unknown paths fall back to index.html.
        try_files $uri $uri/ /index.html;
        # nginx serves these directly, so it adds the correlation ID itself.
        add_header X-Request-ID $nexus_request_id always;
    }

    location /assets/ {
        access_log off;
        expires 1y;
        add_header X-Request-ID  $nexus_request_id always;
        add_header Cache-Control "public, immutable" always;
    }
}
